# REFERENCE ONLY — copy this entry under the main config's `policies:` key.
# Every list is exact-match and every boolean/duration is a conjunction.
- id: codex-orphaned-headless-browser-v1
  description: audit an orphaned headless browser from a completed Codex session
  enabled: false
  mode: disabled
  states: [orphaned]
  agents: [codex]
  executables: [chrome-headless-shell]
  requireDetached: true
  requireSessionEnded: true
  minStable: 30m
  cooldown: 1h
